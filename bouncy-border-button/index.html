<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(26, 25, 25);

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            border: none;
            background: rgb(44, 43, 43);
            padding: 1rem;
            color: white;
            font-weight: bold;
            position: relative;
        }

        button:hover {
            cursor: pointer;
        }

        .top,
        .bottom {
            position: absolute;
            padding: .5rem;
            transition: 0.3s all ease-in-out;
        }

        .top {
            border-top: 1px solid lime;
            border-left: 1px solid lime;

            position: absolute;
            top: 0;
            left: 0;
        }

        .bottom {
            border-bottom: 1px solid red;
            border-right: 1px solid red;

            position: absolute;
            bottom: 0;
            right: 0;
        }

        button:hover .top {
            transform: rotate(180deg) translate(100%, 100%);
            top: 100%;
            left: 100%;
        }

        button:hover .bottom {
            transform: rotate(180deg) translate(-100%, -100%);
            bottom: 100%;
            right: 100%;
        }
    </style>
    <title>Bouncy Animated Border</title>
</head>
<body>
    <button>Click me
        <div class="top"></div>
        <div class="bottom"></div>
    </button>
</body>
</html>
